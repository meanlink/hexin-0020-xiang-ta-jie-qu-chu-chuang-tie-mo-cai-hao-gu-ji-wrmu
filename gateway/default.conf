limit_req_zone $binary_remote_addr zone=login_rate:1m rate=5r/s;
server {
    listen 80;
    client_max_body_size 2m;
    location = /auth/login {
        limit_req zone=login_rate burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
    }
    location / {
        proxy_pass http://backend:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
