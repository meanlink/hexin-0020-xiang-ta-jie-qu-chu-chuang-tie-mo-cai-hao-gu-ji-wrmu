name: hexin-0020
x-runtime: &runtime
  PROJECT_ID: hexin-0020
  DATABASE_URL: postgresql://hexin:${DB_PASSWORD:-hexin-local-only}@db:5432/hexin
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET using .env.example}
  REDIS_URL: redis://redis:6379/0
  SEED_DEMO: ${SEED_DEMO:-true}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin-hexin-demo}
  DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-operator-hexin-demo}
  DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-viewer-hexin-demo}
services:
  gateway:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hexin-0020}-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18369}:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    image: hexin-0020-api:local
    container_name: ${COMPOSE_PROJECT_NAME:-hexin-0020}-backend
    environment: *runtime
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19369}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 2s
      timeout: 4s
      retries: 30
  worker:
    image: hexin-0020-api:local
    pull_policy: never
    container_name: ${COMPOSE_PROJECT_NAME:-hexin-0020}-worker
    command: ["python", "-m", "core.queue_worker"]
    environment: *runtime
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "core.readiness"]
      interval: 2s
      timeout: 4s
      retries: 20
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hexin-0020}-db
    environment:
      POSTGRES_DB: hexin
      POSTGRES_USER: hexin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hexin-local-only}
    ports:
      - "127.0.0.1:${DB_PORT:-17869}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hexin", "-d", "hexin"]
      interval: 2s
      timeout: 3s
      retries: 25
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-hexin-0020}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  db:
  redis:
